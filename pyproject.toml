[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-clickview"
version = "0.2.0"
description = "CLI 工具，模拟浏览器访问抖音视频"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["douyin", "tiktok", "automation", "clickview"]
license = {text = "MIT"}

dependencies = [
    "patchright>=1.48.0",
    "rich>=13.0.0,<14.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "click>=8.0.0,<9.0.0",
    "httpx>=0.25.0,<1.0.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8.0",
    "pytest-asyncio>=0.21.0,<1.0",
    "ruff>=0.1.0,<1.0",
]

[project.scripts]
douyin-clickview = "douyin_clickview.cli:main"

[tool.setuptools.packages.find]
include = ["douyin_clickview*"]
